<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocorrências — AlertaBairro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <nav class="navbar navbar-expand-md navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">AlertaBairro</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link" href="ocorrencias.html">Ocorrências</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>
<main class="container py-4">
  <h1>Ocorrências de risco</h1>
  <div class="layout">
    <section aria-labelledby="t-form">
      <h2 id="t-form" class="h4">Nova ocorrência</h2>
      <form id="form" novalidate>
        <div class="mb-3">
          <label for="tipo" class="form-label">Tipo de risco</label>
          <select id="tipo" class="form-select" required>
            <option value="">Selecione...</option>
            <option>Alagamento</option><option>Deslizamento</option>
            <option>Incêndio</option><option>Onda de calor</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="bairro" class="form-label">Bairro</label>
          <input id="bairro" class="form-control" type="text" required minlength="3" maxlength="60">
        </div>
        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <textarea id="descricao" class="form-control" rows="3" required minlength="10" maxlength="300"></textarea>
        </div>
        <div class="mb-3">
          <label for="nivel" class="form-label">Nível</label>
          <select id="nivel" class="form-select" required>
            <option value="">Selecione...</option>
            <option>Baixo</option><option>Médio</option><option>Alto</option>
          </select>
        </div>
        <p id="erro" class="text-danger" role="alert"></p>
        <p class="small text-muted">Privacidade: não informe dados pessoais. Use apenas dados fictícios e abertos.</p>
        <button id="btn-salvar" class="btn btn-primary" type="submit">Adicionar</button>
        <button id="btn-cancelar" class="btn btn-outline-secondary d-none" type="button">Cancelar edição</button>
      </form>
    </section>
    <section aria-labelledby="t-lista">
      <h2 id="t-lista" class="h4">Lista</h2>
      <div id="lista" class="lista"></div>
    </section>
  </div>
  <section class="mt-4" aria-labelledby="t-log">
    <h2 id="t-log" class="h4">Registro de atividades</h2>
    <ul id="log" class="list-group"></ul>
  </section>
</main>
<footer class="rodape">
  <p>AlertaBairro — protótipo acadêmico (Desenvolvimento Web I). Use apenas dados fictícios.</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
